version: "3.9"

networks:
  iib:
    name: iib

volumes:
  iib-data:
  victoriametrics-data:
  grafana-data:

services:

  iib-manager:
    build: ./manager
    container_name: iib-manager
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - iib-data:/data
    environment:
      VICTORIAMETRICS_URL: http://iib-victoriametrics:8428
    depends_on:
      - iib-victoriametrics
    networks:
      - iib
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  iib-victoriametrics:
    image: victoriametrics/victoria-metrics:stable
    container_name: iib-victoriametrics
    restart: unless-stopped
    ports:
      - "${VICTORIAMETRICS_PORT:-8432}:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    command:
      - "--retentionPeriod=${VICTORIAMETRICS_RETENTION:-90d}"
      - "--httpListenAddr=:8428"
    networks:
      - iib

  iib-grafana:
    image: grafana/grafana:latest
    container_name: iib-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3004}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/iib-overview.json
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on:
      - iib-victoriametrics
    networks:
      - iib
